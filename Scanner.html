<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#116451">
<title>Scanner QR - Sarapan Kilat</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#18382d;background:#f3f6f5}
*{box-sizing:border-box}body{margin:0;padding:16px;min-height:100vh}
main{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e1e9e5;border-radius:18px;padding:18px;box-shadow:0 8px 26px #18362a0d}
h1{font-size:20px;margin:0 0 5px;color:#116451}p{font-size:13px;color:#718078;margin:0 0 14px}
#reader{width:100%;min-height:220px;overflow:hidden;border-radius:14px;background:#101816}
#status{margin:12px 0;padding:11px;border-radius:10px;background:#edf5f0;color:#285a45;font-size:13px;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 15px;font:600 14px system-ui;cursor:pointer}
.primary{background:#116451;color:white}.secondary{background:#edf3ef;color:#244b3b}
button:disabled{opacity:.55}.small{font-size:11px;color:#8a9890;margin-top:14px}
@media(max-width:420px){body{padding:9px}main{padding:13px;border-radius:14px}button{flex:1}}
</style>
</head>
<body>
<main>
  <h1>Sarapan Kilat · Scan QR Member</h1>
  <p>Arahkan kamera belakang ke QR kartu member. Setelah terbaca, hasil dikirim kembali ke aplikasi.</p>
  <div id="reader"></div>
  <div id="status">Menyiapkan scanner…</div>
  <div class="actions">
    <button id="start" class="primary" type="button">Buka kamera</button>
    <button id="switch" class="secondary" type="button" disabled>Ganti kamera</button>
    <button id="close" class="secondary" type="button">Tutup</button>
  </div>
  <div class="small">Gunakan Safari di iPhone atau Chrome di Android. Izinkan akses kamera saat diminta. Halaman wajib HTTPS.</div>
</main>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
  const status = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const switchBtn = document.getElementById('switch');
  let scanner = null, cameras = [], cameraIndex = 0, running = false, done = false;

  function say(message, bad) {
    status.textContent = message;
    status.style.background = bad ? '#fff0f0' : '#edf5f0';
    status.style.color = bad ? '#a52d3b' : '#285a45';
  }
  function friendlyError(err) {
    const n = err && (err.name || err.code) || '';
    const msg = String(err && err.message || err || '');
    if (n === 'NotAllowedError' || /permission|denied|not allowed/i.test(msg))
      return 'Izin kamera ditolak. Aktifkan izin Camera untuk situs ini di pengaturan browser, lalu coba lagi.';
    if (n === 'NotFoundError' || /no camera|camera.*not found/i.test(msg))
      return 'Kamera tidak ditemukan pada perangkat ini.';
    if (n === 'NotReadableError' || /could not start video source|in use/i.test(msg))
      return 'Kamera sedang digunakan aplikasi lain. Tutup aplikasi kamera/meeting lalu coba lagi.';
    if (!window.isSecureContext) return 'Halaman scanner harus menggunakan HTTPS.';
    return 'Kamera gagal dibuka: ' + (msg || 'Periksa izin kamera dan pengaturan browser.');
  }
  async function stop() {
    if (!scanner || !running) return;
    try { await scanner.stop(); } catch(e) {}
    running = false;
    try { scanner.clear(); } catch(e) {}
  }
  async function begin(cameraConfig) {
    if (!window.isSecureContext) throw new Error('Halaman harus menggunakan HTTPS.');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('Browser tidak menyediakan akses kamera. Perbarui browser.');
    if (!window.Html5Qrcode) throw new Error('Library scanner gagal dimuat. Periksa koneksi internet.');
    if (scanner) await stop();
    scanner = new Html5Qrcode('reader');
    await scanner.start(cameraConfig,
      {fps:12, qrbox:(w,h)=>({width:Math.min(w,h,280),height:Math.min(w,h,280)}), aspectRatio:1},
      async text => {
        if (done) return;
        done = true;
        say('QR berhasil dibaca. Mengirim ID member…');
        await stop();
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage({type:'SARAPAN_KILAT_QR_RESULT', text:String(text)}, '*');
          setTimeout(() => window.close(), 700);
        } else {
          say('QR terbaca: ' + text + '\\nJendela aplikasi tidak ditemukan. Salin ID ini ke aplikasi.');
        }
      }, () => {});
    running = true;
    startBtn.textContent = 'Kamera aktif';
    startBtn.disabled = true;
    switchBtn.disabled = cameras.length < 2;
    say('Kamera aktif. Arahkan QR ke dalam bingkai.');
  }
  async function start() {
    done = false;
    startBtn.disabled = true;
    say('Meminta izin kamera…');
    try {
      if (!cameras.length && Html5Qrcode.getCameras) {
        try { cameras = await Html5Qrcode.getCameras(); } catch(e) {}
      }
      if (cameras.length) {
        const rear = cameras.findIndex(c => /back|rear|environment|belakang/i.test(c.label || ''));
        if (rear >= 0 && cameraIndex === 0) cameraIndex = rear;
        await begin(cameras[cameraIndex].id);
      } else {
        await begin({facingMode:'environment'});
      }
    } catch(e) {
      startBtn.disabled = false;
      startBtn.textContent = 'Coba lagi';
      say(friendlyError(e), true);
    }
  }
  startBtn.addEventListener('click', start);
  switchBtn.addEventListener('click', async () => {
    if (cameras.length < 2) return;
    cameraIndex = (cameraIndex + 1) % cameras.length;
    startBtn.disabled = true; switchBtn.disabled = true;
    say('Mengganti kamera…');
    try { await begin(cameras[cameraIndex].id); }
    catch(e) { startBtn.disabled = false; say(friendlyError(e), true); }
  });
  document.getElementById('close').addEventListener('click', async () => {
    await stop(); window.close();
    say('Kamera ditutup. Kembali ke aplikasi Sarapan Kilat.');
  });
  window.addEventListener('pagehide', stop);
  say(window.isSecureContext ? 'Siap. Tekan Buka kamera dan izinkan akses kamera.' : 'Halaman wajib HTTPS.', !window.isSecureContext);
})();
</script>
</body>
</html>
